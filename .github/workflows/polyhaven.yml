name: Poly Haven assets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: scout (list candidates) or fetch (download picks)
        required: true
        default: scout
        type: choice
        options: [scout, fetch, probe]
      only:
        description: optional comma-separated model names to refresh (fetch only)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/polyhaven.ts ${{ inputs.mode }} ${{ inputs.only }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A tools/polyhaven
          if [ -d public/assets/ph ]; then git add -A public/assets/ph; fi
          git diff --cached --quiet && exit 0
          git commit -m "Poly Haven ${{ inputs.mode }} results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

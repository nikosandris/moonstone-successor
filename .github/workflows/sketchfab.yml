name: Sketchfab assets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: scout (search, no token) or fetch (download picks, needs SKETCHFAB_TOKEN)
        required: true
        default: scout
        type: choice
        options: [scout, fetch]
      roles:
        description: optional comma-separated roles (only these; others are kept)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/sketchfab.ts ${{ inputs.mode }} ${{ inputs.roles }}
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A tools/sketchfab
          if [ -d public/assets/sf ]; then git add -A public/assets/sf; fi
          git diff --cached --quiet && exit 0
          git commit -m "Sketchfab ${{ inputs.mode }} results"
          git push

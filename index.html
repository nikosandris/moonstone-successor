<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Moonblood</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d17; color: #e8e6f0; font-family: system-ui, sans-serif; overflow: hidden; }
      #game { position: fixed; inset: 0; }
      #setup { position: fixed; inset: 0; overflow: auto; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #1d2040, #0b0d17); }
      #setup.hidden { display: none; }
      .card { background: #171a30; border: 2px solid #3b4170; border-radius: 14px; padding: 18px 24px; max-width: 720px; width: 92%; }
      h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 3px; color: #e9e4ff; }
      .sub { margin: 0 0 14px; color: #9aa0cc; }
      .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
      .row label { min-width: 90px; }
      input[type=text] { flex: 1; min-width: 120px; font-size: 18px; padding: 10px; border-radius: 8px; border: 1px solid #4a5290; background: #0f1226; color: #fff; }
      button, select { font-size: 18px; padding: 10px 14px; border-radius: 8px; border: 1px solid #4a5290; background: #262b57; color: #fff; cursor: pointer; }
      button.big { width: 100%; padding: 16px; font-size: 22px; background: #5b3fd0; margin-top: 12px; }
      .swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
      .swatch.sel { border-color: #fff; }
      .count button.sel { background: #5b3fd0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="setup"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
